name: Build

on:
  push:
    branches: [iostreamConfigurable]
    tags: ["v*"]
  pull_request:
    branches: [iostreamConfigurable]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-64
            os: ubuntu-latest
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
          - platform: osx-64
            os: macos-15-intel
          - platform: osx-arm64
            os: macos-14

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.59.0
          run-install: false

      - name: Build packages
        run: pixi build --output-dir dist

      - name: Install rattler-build
        run: pixi global install rattler-build

      - name: Test packages
        run: |
          for pkg in dist/*.conda; do
            echo "Testing $pkg"
            rattler-build test --package-file "$pkg"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: dist/*.conda
          if-no-files-found: error

  merge-artifacts:
    needs: build
    runs-on: ubuntu-latest
    name: Merge artifacts

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: packages-*
          merge-multiple: true

      - name: Upload merged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-packages
          path: packages/*.conda
          if-no-files-found: error
